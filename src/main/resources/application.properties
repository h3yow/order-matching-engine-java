server.port=0

# ===== 撮合与风控配置（定点单位：1 = 0.0001）=====
# 单笔订单最大数量（100）
trading.max-order-quantity=1000000
# 单标的净持仓绝对值上限（1000）
trading.max-position=10000000
# 价格合理性/市价保护带：相对参考价最大偏离 5%（500bps）
trading.max-deviation-bps=500
# 可用现金下限（不得出现负余额）
trading.min-available-cash=0
# 事件流水目录（重启后据此重放）
trading.event-log-dir=data/trading-log
# 演示种子账户（资金，单位 0.0001）
trading.seed-accounts.alice=10000000000
trading.seed-accounts.bob=10000000000
# 演示种子持仓：key 格式 accountId__symbol
trading.seed-positions.alice__BTC=1000000
